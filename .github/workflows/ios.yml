name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Enviar para o TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar (simulador)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode mais recente
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Gerar projeto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pessoal.xcodeproj \
            -scheme Pessoal \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  testflight:
    name: Enviar para o TestFlight
    needs: compilar
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      PERFIL_NOME: ${{ secrets.PERFIL_APPSTORE_NOME }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar segredos
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID PERFIL_NOME; do
            if [ -z "${!v}" ]; then echo "::error::Falta o segredo para $v"; exit 1; fi
          done

      - name: Xcode mais recente
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Gerar projeto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Chave da App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Um único certificado de distribuição, guardado nos segredos: nenhum envio cria certificados novos.
      - name: Certificado e perfil de distribuição
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_SENHA: ${{ secrets.DIST_P12_SENHA }}
          PERFIL_APPSTORE: ${{ secrets.PERFIL_APPSTORE }}
        run: |
          CHAVEIRO="$RUNNER_TEMP/assinatura.keychain-db"
          SENHA_CHAVEIRO="$(openssl rand -hex 16)"
          security create-keychain -p "$SENHA_CHAVEIRO" "$CHAVEIRO"
          security set-keychain-settings -lut 3600 "$CHAVEIRO"
          security unlock-keychain -p "$SENHA_CHAVEIRO" "$CHAVEIRO"
          echo "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          # O .p12 vem em AES/PBKDF2; o `security` do macOS só importa o formato antigo (3DES + SHA-1).
          OSSL="$(brew --prefix openssl@3)/bin/openssl"
          "$OSSL" pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:DIST_P12_SENHA -nodes -out "$RUNNER_TEMP/dist.pem"
          "$OSSL" pkcs12 -export -in "$RUNNER_TEMP/dist.pem" -out "$RUNNER_TEMP/dist-mac.p12" \
            -passout env:DIST_P12_SENHA -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          rm -f "$RUNNER_TEMP/dist.pem"
          security import "$RUNNER_TEMP/dist-mac.p12" -k "$CHAVEIRO" -P "$DIST_P12_SENHA" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$SENHA_CHAVEIRO" "$CHAVEIRO" > /dev/null
          security list-keychains -d user -s "$CHAVEIRO" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/dist-mac.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PERFIL_APPSTORE" | base64 --decode > "$RUNNER_TEMP/perfil.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/perfil.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "CHAVEIRO=$CHAVEIRO" >> "$GITHUB_ENV"

      - name: Arquivar
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Pessoal.xcodeproj \
            -scheme Pessoal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pessoal.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PERFIL_NOME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $CHAVEIRO" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | xcbeautify --renderer github-actions

      - name: Enviar
        run: |
          sed -e "s/TEAM_ID/$TEAM_ID/" -e "s/PERFIL_NOME/$PERFIL_NOME/" -e "s/BUNDLE_ID/${{ vars.BUNDLE_ID }}/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pessoal.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Apagar chaves
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/perfil.mobileprovision"
          [ -n "$CHAVEIRO" ] && security delete-keychain "$CHAVEIRO" || true
