name: Pessoal
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Preenche com o Team ID da conta Apple Developer antes de arquivar para o TestFlight.
    # DEVELOPMENT_TEAM: XXXXXXXXXX
targets:
  Pessoal:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - Pessoal
    info:
      path: Pessoal/Info.plist
      properties:
        CFBundleDisplayName: Akili
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-PT
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Para tirares uma foto e a mostrares ao agente.
        UIAppFonts:
          - AkiliRoboto-Regular.ttf
          - AkiliRoboto-Medium.ttf
          - AkiliRoboto-Bold.ttf
          - AkiliRoboto-Black.ttf
          - AkiliLiterata-Regular.ttf
          - AkiliLiterata-Medium.ttf
          - AkiliLiterata-Italic.ttf
          - YoungSerif-Regular.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
        NSMicrophoneUsageDescription: Para ditares mensagens ao agente em vez de as escreveres.
        NSSpeechRecognitionUsageDescription: Para transformar o que dizes em texto, sempre que possível no próprio iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hermesvoice  # muda para o teu
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Pessoal/Pessoal.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Pessoal/Pessoal-Release.entitlements
